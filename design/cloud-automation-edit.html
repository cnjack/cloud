<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="jcode Cloud 自动化设置，统一设计交互原型，示例数据。"><title>自动化设置 · jcode Cloud</title><link rel="icon" href="./assets/app-icon.svg"><link rel="stylesheet" href="./assets/prototype.css"><link rel="stylesheet" href="./assets/work-home-refresh.css"><link rel="stylesheet" href="./assets/cloud-suite.css"><script src="./assets/cloud-suite.js" defer></script></head>
<body data-page="automation-edit" data-scope="repository"><a class="skip-link" href="#main">跳到主内容</a><div class="layout"><aside class="rail" id="rail" aria-label="账号导航">
  <a class="brand" href="./work-home-refresh.html"><img src="./assets/app-icon.svg" alt="jcode"><b>jcode</b><span>cloud</span></a>
  <button class="new-task" data-new><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-plus"/></svg><span>新任务</span><kbd>⌥ N</kbd></button>
  <button class="rail-search" data-search-focus><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-search"/></svg><span>搜索最近任务</span><kbd>⌘ K</kbd></button>
  <div class="rail-section"><span>最近仓库</span></div>
  <nav class="workspace-nav" aria-label="仓库">
    <button class="selected" data-repo="jcode"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-git"/></svg><span>jcode</span><span class="repo-owner">cnjack</span></button>
    <button data-repo="bigmodel-usage"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-git"/></svg><span>bigmodel-usage</span></button>
  </nav>
  <nav class="workspace-nav remote-nav" aria-label="远程设备"><a href="./cloud-devices.html"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-terminal"/></svg><span>远程设备</span><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-chevron-right"/></svg></a></nav>
  <div class="rail-section recent-heading"><span>最近对话</span><span>示例</span></div>
  <div class="rail-history" id="history"></div>
  <div class="rail-bottom">
    <button id="all-repositories" popovertarget="repository-browser"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-git"/></svg><span>所有仓库</span><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-arrow-right"/></svg></button>
    <button data-settings><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-sliders"/></svg><span>个人设置</span></button>
    <div class="account"><span class="avatar">JA</span><span><b>Jack</b><small>个人工作区</small></span><a href="./cloud-usage.html?scope=account" aria-label="查看账号用量"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-more"/></svg></a></div>
  </div>
</aside><section class="surface"><header class="topbar"><div><button class="mobile-toggle" aria-label="打开导航" aria-controls="rail" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-projects"/></svg></button><a href="./work-home-refresh.html">工作台</a><span class="slash">/</span><span class="quiet">自动化设置</span></div><div class="top-actions"><span class="prototype-label">设计预览 · 示例数据</span><a href="./cloud-map.html" aria-label="查看完整设计导航"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-projects"/></svg></a></div></header><main id="main" class="suite-main"><div class="s-repo-context"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-git"/></svg><strong data-repo-name>cnjack / jcode</strong><span>GitHub</span><span class="s-mono">main</span><a class="s-btn s-small" href="./work-home-refresh.html" data-repo-link><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-plus"/></svg>新任务</a></div><nav class="repo-tabs" aria-label="仓库功能"><a class="" href="./work-home-refresh.html" data-repo-link>任务</a><a class="" href="./cloud-board.html" data-repo-link>看板</a><a class="" href="./cloud-reviews.html" data-repo-link>代码审查</a><a class="" href="./cloud-automations.html" data-repo-link>自动化</a><a class="" href="./cloud-usage.html" data-repo-link>用量</a><a class="" href="./cloud-repository-settings.html" data-repo-link>设置</a></nav><a class="s-back" href="./cloud-automations.html" data-repo-link><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-arrow-left"/></svg>返回自动化</a><header class="s-heading"><div><h1>配置自动化</h1><p>指定触发条件、执行模型和任务说明。</p></div><div class="s-actions"></div></header><form class="s-editor" data-preview-form="自动化配置已保存在本地设计预览中，未启用真实调度。" data-save-key="automation"><label class="s-field"><span>名称</span><input name="name" type="text" value="每周依赖检查" required></label><label class="s-field"><span>触发方式</span><select name="trigger"><option>定时执行</option><option>Pull request 就绪</option><option>看板进入 Agent 队列</option></select></label><div class="s-two-fields"><label class="s-field"><span>执行时间</span><input name="schedule" type="text" value="每周一 09:00" ></label><label class="s-field"><span>时区</span><select name="timezone"><option>Asia/Shanghai</option><option>UTC</option></select></label></div><label class="s-field"><span>任务说明</span><textarea name="prompt" rows="5" required>检查当前仓库的依赖版本，列出需要升级的包、兼容性风险和建议。先给出计划，不直接修改代码。</textarea></label><div class="s-two-fields"><label class="s-field"><span>模型</span><select name="model"><option>GLM-5.2</option><option>GPT-5.6</option></select></label><label class="s-field"><span>权限</span><select name="permission"><option>操作前审批</option><option>完全访问</option></select></label></div><div class="s-notice "><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-info"/></svg><span>执行失败会保留原因。依赖不可用时不会报告成功。</span></div><div class="s-form-actions"><button class="s-btn s-primary" type="submit">保存预览</button><a class="s-btn" href="./cloud-automations.html" data-repo-link>取消</a></div><p class="s-form-result" role="status"></p></form></main></section></div><section id="repository-browser" class="repository-browser" popover aria-labelledby="repository-browser-title">
  <header><div><h2 id="repository-browser-title">所有仓库</h2><p>选择账号可访问的代码仓库</p></div><button popovertarget="repository-browser" popovertargetaction="hide" aria-label="关闭仓库选择">×</button></header>
  <label class="repository-search"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#i-search"/></svg><input id="repository-search" type="search" placeholder="搜索仓库或所属账号" aria-label="搜索所有仓库" autofocus></label>
  <div id="repository-results" class="repository-results" aria-live="polite"></div>
  <p class="repository-no-results" id="repository-no-results" hidden>没有找到匹配的仓库，试试其他关键词。</p>
  <footer>GitHub · cnjack <span>示例仓库</span></footer>
</section>
<div class="s-toast" role="status" hidden></div><dialog id="suite-dialog" aria-labelledby="suite-dialog-title"><form method="dialog"><button class="dialog-close" aria-label="关闭">×</button></form><span class="dialog-eyebrow">设计预览</span><h2 id="suite-dialog-title"></h2><div id="suite-dialog-body"></div></dialog></body></html>
