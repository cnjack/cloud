# Build and push jcloud images to GHCR plus the Shanghai Aliyun ACR mirror, then
# cut a release.
#
# Every push to main is a release. The version is auto-derived from git tags:
# the latest v<X.Y.Z> tag's patch number is bumped, so there is no VERSION file
# in the repo. All core and optional Runner Profile images push to GHCR;
# Orchestrator, Runner, Console, and the four Profiles also push to Aliyun ACR.
# Both registries receive identical `v<version>`, `latest`, and commit-SHA tags,
# and the final job creates the same `v<version>` Git tag.
# The tag is created only after every image has been pushed, so a failed build
# never leaves a dangling release tag.
# Required repository settings for the Aliyun mirror:
#   secret ALIYUN_DOCKER_REGISTRY_USERNAME = ACR login username
#   secret ALIYUN_DOCKER_REGISTRY_SECRET   = ACR login password
#
# Images (all linux/amd64 — the target company cluster is amd64-only):
#   ghcr.io/<owner>/jcloud-orchestrator   from orchestrator/
#   ghcr.io/<owner>/jcloud-runner         from runner/ (jcode compiled from the
#                                         public cnjack/jcode checkout)
#   ghcr.io/<owner>/jcloud-runner-<profile>
#                                         from runner/profiles/Dockerfile
#                                         (go-node, python, rust, polyglot)
#   ghcr.io/<owner>/jcloud-console        from console/ (vite build + nginx)
#   ghcr.io/<owner>/jcloud-mockllm        from deploy/mockllm/Dockerfile
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases so two overlapping runs cannot publish the same version.
concurrency:
  group: images-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ALIYUN_REGISTRY: registry.cn-shanghai.aliyuncs.com
  ALIYUN_NAMESPACE: jcode-cloud

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Derive release version from git tags
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            version="0.0.1"
          else
            # Bump the patch number of the latest tag.
            base="${latest#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            patch=$((patch + 1))
            version="$major.$minor.$patch"
          fi
          # If the tag already exists (e.g. concurrent dispatch), keep bumping.
          while git rev-parse -q --verify "refs/tags/v$version" >/dev/null; do
            patch=$((patch + 1))
            version="$major.$minor.$patch"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: v$version (latest tag: ${latest:-none})"

  orchestrator:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_REGISTRY_SECRET }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/jcloud-orchestrator
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/jcloud-orchestrator
          tags: |
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: orchestrator
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=v${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator

  runner:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The runner image bundles the jcode headless binary, compiled from the
      # jcode repo (public) — same layout runner/build.sh expects.
      - uses: actions/checkout@v4
        with:
          repository: cnjack/jcode
          path: jcode
      - uses: actions/setup-go@v5
        with:
          go-version-file: jcode/go.mod
          # orchclient/mockllm are stdlib-only (no go.sum).
          cache-dependency-path: |
            jcode/go.sum
            runner/acpdrive/go.sum
      - name: Compile runner binaries (linux/amd64)
        run: JCODE_SRC="$GITHUB_WORKSPACE/jcode" TARGETARCH=amd64 SKIP_DOCKER=1 ./runner/build.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_REGISTRY_SECRET }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/jcloud-runner
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/jcloud-runner
          tags: |
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  runner-profile:
    name: runner-profile (${{ matrix.profile }})
    needs: [version, runner]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: go-node
            verify: go version && node --version && npm --version && corepack --version
          - profile: python
            verify: python --version && pip --version
          - profile: rust
            verify: rustc --version && cargo --version
          - profile: polyglot
            verify: go version && node --version && npm --version && python --version && rustc --version
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_REGISTRY_SECRET }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/jcloud-runner-${{ matrix.profile }}
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/jcloud-runner-${{ matrix.profile }}
          tags: |
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish ${{ matrix.profile }} Runner Profile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/profiles/Dockerfile
          target: ${{ matrix.profile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/jcloud-runner:sha-${{ github.sha }}
            GO_SOURCE_IMAGE=golang:1.24-bookworm@sha256:1a6d4452c65dea36aac2e2d606b01b4a029ec90cc1ae53890540ce6173ea77ac
            NODE_SOURCE_IMAGE=node:22-bookworm-slim@sha256:f32b81066cde10a75dbac96646099533316d94bac4150c55da1636e1f0ffdc46
            PYTHON_SOURCE_IMAGE=python:3.13-bookworm@sha256:353cf2106d143e1d28f5d7c10c5f5c0387085bba22ef0f7f7e52c2c330fb1779
            RUST_SOURCE_IMAGE=rust:1.85-bookworm@sha256:e51d0265072d2d9d5d320f6a44dde6b9ef13653b035098febd68cce8fa7c0bc4
          cache-from: type=gha,scope=runner-profile-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=runner-profile-${{ matrix.profile }}
      - name: Verify ${{ matrix.profile }} toolchain
        env:
          PROFILE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/jcloud-runner-${{ matrix.profile }}:sha-${{ github.sha }}
          VERIFY_COMMAND: ${{ matrix.verify }}
        run: docker run --rm --entrypoint /bin/sh "$PROFILE_IMAGE" -c "$VERIFY_COMMAND"

  console:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # M14 transition: console depends on jcode-ui/jcode-ui-core via
      # unpublished file: paths into the sibling jcode repo, which is outside
      # the docker build context (console/). The prepare script packs both
      # packages into console/.pkg/ and temporarily rewrites the
      # manifests/lockfile/Dockerfile to the tarballs. Delete this once
      # jcode-ui is published to the registry.
      - uses: actions/checkout@v4
        with:
          repository: cnjack/jcode
          path: jcode
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack jcode-ui into console/.pkg
        env:
          JCODE_REPO: ${{ github.workspace }}/jcode
        run: node console/scripts/prepare-jcode-ui.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_REGISTRY_SECRET }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/jcloud-console
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/jcloud-console
          tags: |
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: console
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=v${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

  mockllm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/jcloud-mockllm
          tags: |
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/mockllm/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    # Tag only once every image for this version has been pushed, so the git tag
    # always corresponds to a fully published release. Only main cuts releases —
    # workflow_dispatch from a feature branch builds/pushes images without a tag.
    if: github.ref == 'refs/heads/main'
    needs: [version, orchestrator, runner, runner-profile, console, mockllm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push v${{ needs.version.outputs.version }} tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
